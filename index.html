<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>استبيان CBRS لتقييم الطفل</title>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f0f4f8;
      color: #1e293b;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 20px;
    }
    .container {
      max-width: 850px;
      width: 100%;
      background: #ffffff;
      border-radius: 28px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.08);
      padding: 30px 25px;
      margin-top: 10px;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      color: #0b3b5c;
      text-align: center;
      margin-bottom: 8px;
    }
    .subhead {
      text-align: center;
      color: #64748b;
      font-size: 14px;
      margin-bottom: 25px;
      border-bottom: 1px solid #e9edf2;
      padding-bottom: 15px;
    }
    .child-form {
      background: #f8fafc;
      border-radius: 20px;
      padding: 20px 20px 15px;
      margin-bottom: 25px;
      border: 1px solid #e2e8f0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px 25px;
    }
    .child-form .full-width {
      grid-column: span 2;
    }
    .child-form label {
      font-weight: 600;
      font-size: 14px;
      color: #334155;
      display: block;
      margin-bottom: 4px;
    }
    .child-form input, .child-form select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      font-size: 14px;
      background: white;
      transition: 0.2s;
    }
    .child-form input:focus, .child-form select:focus {
      border-color: #2563eb;
      outline: none;
      box-shadow: 0 0 0 3px rgba(37,99,235,0.15);
    }
    .child-form .age-display {
      background: #e2e8f0;
      padding: 8px 16px;
      border-radius: 30px;
      font-weight: 600;
      color: #0b3b5c;
      display: inline-block;
      margin-top: 6px;
      font-size: 15px;
    }
    .progress-section {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 25px;
    }
    .progress-bar-bg {
      flex: 1;
      height: 8px;
      background: #e2e8f0;
      border-radius: 10px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #2563eb, #7c3aed);
      border-radius: 10px;
      transition: width 0.3s ease;
    }
    .progress-text {
      font-size: 15px;
      font-weight: 600;
      color: #334155;
      min-width: 80px;
      text-align: left;
    }
    .message-box {
      background: #fef2f2;
      border: 2px solid #fca5a5;
      border-radius: 16px;
      padding: 12px 18px;
      margin-bottom: 16px;
      color: #991b1b;
      font-weight: 500;
      display: none;
    }
    .message-box.show {
      display: block;
    }
    .message-box .q-list {
      font-size: 15px;
      background: white;
      padding: 8px 14px;
      border-radius: 10px;
      display: inline-block;
      margin-top: 4px;
      border: 1px solid #fca5a5;
      color: #1e293b;
    }
    .question-card {
      background: #f8fafc;
      border-radius: 20px;
      padding: 25px 20px;
      margin-bottom: 20px;
      border: 1px solid #e9edf2;
    }
    .q-number {
      font-size: 14px;
      font-weight: 600;
      color: #2563eb;
      background: #dbeafe;
      display: inline-block;
      padding: 2px 14px;
      border-radius: 30px;
      margin-bottom: 12px;
    }
    .q-section {
      font-size: 13px;
      color: #64748b;
      margin-right: 8px;
    }
    .q-text {
      font-size: 18px;
      line-height: 1.6;
      font-weight: 500;
      margin-bottom: 20px;
      color: #0f172a;
    }
    .options-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 8px;
    }
    .option-item {
      flex: 1 0 auto;
      min-width: 60px;
      text-align: center;
    }
    .option-item input[type="radio"] {
      display: none;
    }
    .option-item label {
      display: block;
      padding: 8px 4px;
      background: #ffffff;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 500;
      color: #334155;
      cursor: pointer;
      transition: 0.2s;
    }
    .option-item input[type="radio"]:checked + label {
      border-color: #2563eb;
      background: #eff6ff;
      color: #1e4c8c;
      box-shadow: 0 4px 8px rgba(37,99,235,0.15);
    }
    .option-item input[type="radio"]:checked + label.deferred-label {
      border-color: #f59e0b;
      background: #fffbeb;
      color: #b45309;
    }
    .option-item label:hover {
      background: #f1f5f9;
      border-color: #94a3b8;
    }
    .nav-buttons {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      gap: 12px;
      flex-wrap: wrap;
    }
    .btn {
      padding: 12px 28px;
      border: none;
      border-radius: 40px;
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
      transition: 0.2s;
      background: #e9edf2;
      color: #1e293b;
      flex: 1 1 auto;
      min-width: 100px;
    }
    .btn-primary {
      background: #2563eb;
      color: white;
      box-shadow: 0 4px 10px rgba(37,99,235,0.25);
    }
    .btn-primary:hover {
      background: #1d4ed8;
      transform: translateY(-2px);
    }
    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    .btn-secondary {
      background: #e2e8f0;
      color: #1e293b;
    }
    .btn-secondary:hover {
      background: #cbd5e1;
    }
    .btn-danger {
      background: #ef4444;
      color: white;
    }
    .btn-danger:hover {
      background: #dc2626;
    }
    .btn-success {
      background: #22c55e;
      color: white;
    }
    .btn-success:hover {
      background: #16a34a;
    }
    .btn-warning {
      background: #f59e0b;
      color: white;
    }
    .btn-warning:hover {
      background: #d97706;
    }
    .results-section {
      display: none;
    }
    .results-section.active {
      display: block;
    }
    .results-title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 20px;
      color: #0b3b5c;
    }
    .result-card {
      background: #f8fafc;
      border-radius: 16px;
      padding: 18px 20px;
      margin-bottom: 12px;
      border-right: 6px solid #2563eb;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }
    .result-card .section-name {
      font-weight: 600;
      font-size: 16px;
    }
    .result-card .avg-score {
      font-weight: 700;
      font-size: 18px;
      background: #e2e8f0;
      padding: 4px 16px;
      border-radius: 30px;
    }
    .result-bar {
      width: 100%;
      height: 6px;
      background: #e2e8f0;
      border-radius: 10px;
      margin-top: 8px;
      overflow: hidden;
    }
    .result-bar .bar-fill {
      height: 100%;
      border-radius: 10px;
      transition: width 0.6s;
    }
    .total-score {
      margin-top: 20px;
      text-align: center;
      font-size: 20px;
      font-weight: 700;
      color: #0b3b5c;
    }
    .btn-group {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 25px;
    }
    .review-badge {
      background: #f59e0b;
      color: white;
      padding: 4px 14px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 600;
      display: inline-block;
      margin-right: 10px;
    }
    @media (max-width: 700px) {
      .child-form { grid-template-columns: 1fr; gap: 10px; }
      .child-form .full-width { grid-column: span 1; }
    }
    @media (max-width: 600px) {
      .container { padding: 18px 15px; }
      .options-grid { gap: 4px; }
      .option-item { min-width: 45px; }
      .option-item label { font-size: 11px; padding: 6px 2px; }
      .q-text { font-size: 16px; }
    }
    @media (max-width: 450px) {
      .option-item { flex: 1 0 30%; }
      .nav-buttons .btn { font-size: 14px; padding: 10px 16px; min-width: 70px; }
    }
  </style>
</head>
<body>
<div class="container" id="app">
  <h1>📋 استبيان تقييم الطفل (CBRS)</h1>
  <div class="subhead">أجب عن كل عبارة بتقدير من 1 (كثير جداً) إلى 6 (لا يحدث مطلقاً) أو اختر "تأجيل"</div>

  <!-- Child Data Form -->
  <div class="child-form" id="childForm">
    <div>
      <label for="childName">👤 الاسم *</label>
      <input type="text" id="childName" placeholder="اسم الطفل">
    </div>
    <div>
      <label for="childGender">⚥ النوع *</label>
      <select id="childGender">
        <option value="">اختر</option>
        <option value="ذكر">ذكر</option>
        <option value="أنثى">أنثى</option>
      </select>
    </div>
    <div>
      <label for="childBirth">🎂 تاريخ الميلاد *</label>
      <input type="date" id="childBirth">
    </div>
    <div>
      <label for="childAge">📅 العمر الزمني</label>
      <span class="age-display" id="childAge">-- سنة</span>
    </div>
    <div>
      <label for="childSchool">🏫 المدرسة *</label>
      <input type="text" id="childSchool" placeholder="اسم المدرسة">
    </div>
    <div>
      <label for="childGrade">📚 الصف *</label>
      <input type="text" id="childGrade" placeholder="مثال: 3 ابتدائي">
    </div>
  </div>

  <!-- Progress -->
  <div class="progress-section">
    <div class="progress-bar-bg">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <span class="progress-text" id="progressText">0 / 78</span>
  </div>

  <!-- Message Box -->
  <div id="messageBox" class="message-box">
    <span id="messageText"></span>
    <div class="q-list" id="messageList"></div>
  </div>

  <!-- Question area -->
  <div id="questionArea">
    <div class="question-card">
      <div>
        <span class="q-number" id="qNumber">السؤال 1</span>
        <span class="q-section" id="qSection">(التوافق الشخصي)</span>
        <span id="reviewBadge" class="review-badge hidden">⏳ مراجعة مؤجل</span>
      </div>
      <div class="q-text" id="qText">نص السؤال هنا</div>
      <div class="options-grid" id="optionsContainer">
        <!-- generated by JS -->
      </div>
    </div>

    <div class="nav-buttons">
      <button class="btn btn-secondary" id="prevBtn">⟪ السابق</button>
      <button class="btn btn-primary" id="nextBtn">التالي ⟫</button>
      <button class="btn btn-danger" id="resetBtn" style="flex:0 1 auto; min-width:60px;">↺</button>
    </div>
  </div>

  <!-- Results area -->
  <div class="results-section" id="resultsArea">
    <div class="results-title">📊 نتائج التقييم</div>
    <div id="resultsContainer"></div>
    <div class="total-score" id="totalScore"></div>
    <div class="btn-group">
      <button class="btn btn-secondary" id="backToQuestionsBtn">🔙 العودة للأسئلة</button>
      <button class="btn btn-success" id="exportExcelBtn">📊 تصدير إلى إكسل</button>
      <button class="btn btn-danger" id="resetResultsBtn">🗑️ إعادة تعيين</button>
    </div>
  </div>
</div>

      { id: 'q67', section: 'مدرسي', text: 'يجد صعوبة في إنجاز العمل المدرسي' },
      { id: 'q68', section: 'مدرسي', text: 'لا يشارك في الأنشطة المتصلة بالمنهج الدراسي' },
      { id: 'q69', section: 'مدرسي', text: 'علاقته سيئة مع مدرس أو أكثر من مدرس' },
      { id: 'q70', section: 'مدرسي', text: 'يدفع الوالدان الطفل إلى أداء واجب المدرسة بطريقة تضايقه' },
      { id: 'q71', section: 'مدرسي', text: 'لا يبذل جهداً كبيراً أو مستمراً في الواجبات المدرسية' },
      { id: 'q72', section: 'مدرسي', text: 'يختلف مستواه الدراسي – ارتفاعاً وانخفاضاً – من يوم إلى يوم' },
      { id: 'q73', section: 'جسمي', text: 'صحته معتلة بوجه عام' },
      { id: 'q74', section: 'جسمي', text: 'سيطرته ضئيلة على عضلاته وتناسقه الحركي رديء' },
      { id: 'q75', section: 'جسمي', text: 'أسنانه غير نظيفة ومظهره غير منظم (مهمل)' },
      { id: 'q76', section: 'جسمي', text: 'طاقته أو حيويته ضعيفة' },
      { id: 'q77', section: 'جسمي', text: 'توجد شواهد على معاناته من قصور في الإدراك عن طريق الحواس' },
      { id: 'q78', section: 'جسمي', text: 'بصره ضعيف أو سمعه ثقيل' }
    ];
    const totalQuestions = questions.length;

    // ---------- STATE ----------
    let currentIndex = 0;
    let responses = {};
    let childData = { name: '', gender: '', birth: '', school: '', grade: '' };
    let reviewMode = false;
    let pendingQueue = []; // array of indices (0-based) of deferred/unanswered questions

    // DOM refs
    const qNumberEl = document.getElementById('qNumber');
    const qSectionEl = document.getElementById('qSection');
    const qTextEl = document.getElementById('qText');
    const optionsContainer = document.getElementById('optionsContainer');
    const progressFill = document.getElementById('progressFill');
    const progressText = document.getElementById('progressText');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const resetBtn = document.getElementById('resetBtn');
    const questionArea = document.getElementById('questionArea');
    const resultsArea = document.getElementById('resultsArea');
    const resultsContainer = document.getElementById('resultsContainer');
    const totalScoreEl = document.getElementById('totalScore');
    const backToQuestionsBtn = document.getElementById('backToQuestionsBtn');
    const resetResultsBtn = document.getElementById('resetResultsBtn');
    const exportExcelBtn = document.getElementById('exportExcelBtn');
    const messageBox = document.getElementById('messageBox');
    const messageText = document.getElementById('messageText');
    const messageList = document.getElementById('messageList');
    const reviewBadge = document.getElementById('reviewBadge');

    // Child form
    const childName = document.getElementById('childName');
    const childGender = document.getElementById('childGender');
    const childBirth = document.getElementById('childBirth');
    const childAge = document.getElementById('childAge');
    const childSchool = document.getElementById('childSchool');
    const childGrade = document.getElementById('childGrade');

    // ---------- Age ----------
    function calculateAge(birthDateStr) {
      if (!birthDateStr) return '-- سنة';
      const birth = new Date(birthDateStr);
      const today = new Date();
      let years = today.getFullYear() - birth.getFullYear();
      let months = today.getMonth() - birth.getMonth();
      if (months < 0) { years--; months += 12; }
      if (years < 0) return '-- سنة';
      if (years === 0 && months === 0) return 'أقل من شهر';
      let result = '';
      if (years > 0) result += years + ' سنة';
      if (months > 0) result += (result ? ' و ' : '') + months + ' شهر';
      return result;
    }
    function updateAgeDisplay() {
      childAge.textContent = calculateAge(childBirth.value);
    }

    // ---------- Storage ----------
    function loadFromStorage() {
      const stored = localStorage.getItem('cbrsFullData');
      if (stored) {
        try {
          const data = JSON.parse(stored);
          if (data.child) {
            childData = data.child;
            childName.value = childData.name || '';
            childGender.value = childData.gender || '';
            childBirth.value = childData.birth || '';
            childSchool.value = childData.school || '';
            childGrade.value = childData.grade || '';
            updateAgeDisplay();
          }
          if (data.responses) {
            responses = data.responses;
          }
          questions.forEach(q => {
            if (!(q.id in responses)) responses[q.id] = undefined;
          });
        } catch (e) {
          resetResponses();
        }
      } else {
        resetResponses();
      }
    }
    function resetResponses() {
      responses = {};
      questions.forEach(q => { responses[q.id] = undefined; });
    }
    function saveToStorage() {
      childData.name = childName.value;
      childData.gender = childGender.value;
      childData.birth = childBirth.value;
      childData.school = childSchool.value;
      childData.grade = childGrade.value;
      localStorage.setItem('cbrsFullData', JSON.stringify({ child: childData, responses: responses }));
    }

    // ---------- Child data validation ----------
    function isChildDataComplete() {
      return childName.value.trim() !== '' &&
             childGender.value !== '' &&
             childBirth.value !== '' &&
             childSchool.value.trim() !== '' &&
             childGrade.value.trim() !== '';
    }

    // ---------- Pending helpers ----------
    function getPendingIndices() {
      const pending = [];
      questions.forEach((q, idx) => {
        const val = responses[q.id];
        if (val === undefined || val === null) {
          pending.push(idx);
        }
      });
      return pending;
    }

    // ---------- Render ----------
    function renderQuestion() {
      const q = questions[currentIndex];
      qNumberEl.textContent = `السؤال ${currentIndex+1}`;
      qSectionEl.textContent = `(${q.section})`;
      qTextEl.textContent = q.text;

      // Show review badge if in review mode
      if (reviewMode) {
        reviewBadge.classList.remove('hidden');
      } else {
        reviewBadge.classList.add('hidden');
      }

      // Generate options
      let html = '';
      const labels = ['كثير جداً', 'كثير', 'قليل', 'نادر', 'نادر جداً', 'لا يحدث مطلقاً'];
      for (let i = 1; i <= 6; i++) {
        const checked = (responses[q.id] === i) ? 'checked' : '';
        html += `
          <div class="option-item">
            <input type="radio" name="qOption" value="${i}" id="${q.id}_${i}" ${checked}>
            <label for="${q.id}_${i}">${i}<br><span style="font-weight:400;font-size:11px;display:block;color:#64748b;">${labels[i-1]}</span></label>
          </div>
        `;
      }
      const isDeferred = (responses[q.id] === null);
      html += `
        <div class="option-item">
          <input type="radio" name="qOption" value="defer" id="${q.id}_defer" ${isDeferred ? 'checked' : ''}>
          <label for="${q.id}_defer" class="deferred-label">⏳<br><span style="font-weight:400;font-size:11px;display:block;">تأجيل</span></label>
        </div>
      `;
      optionsContainer.innerHTML = html;

      // Attach change events
      const radios = optionsContainer.querySelectorAll('input[type="radio"]');
      radios.forEach(radio => {
        radio.addEventListener('change', function() {
          const val = this.value;
          if (val === 'defer') {
            responses[q.id] = null;
          } else {
            responses[q.id] = parseInt(val, 10);
          }
          saveToStorage();
          updateProgress();
          hideMessage();
        });
      });

      updateProgress();
      updateNavButtons();
      hideMessage();
    }

    function updateProgress() {
      const answered = questions.filter(q => responses[q.id] !== undefined && responses[q.id] !== null).length;
      const pct = (answered / totalQuestions) * 100;
      progressFill.style.width = pct + '%';
      progressText.textContent = `${answered} / ${totalQuestions}`;
    }

    function updateNavButtons() {
      prevBtn.disabled = (currentIndex === 0 && !reviewMode) || (reviewMode && pendingQueue.length === 0);
      if (currentIndex === totalQuestions - 1 && !reviewMode) {
        nextBtn.textContent = '🏁 إنهاء';
        nextBtn.classList.add('btn-success');
        nextBtn.classList.remove('btn-primary');
      } else if (reviewMode) {
        nextBtn.textContent = 'التالي ⟫';
        nextBtn.classList.remove('btn-success');
        nextBtn.classList.add('btn-primary');
      } else {
        nextBtn.textContent = 'التالي ⟫';
        nextBtn.classList.remove('btn-success');
        nextBtn.classList.add('btn-primary');
      }
    }

    function showMessage(text, list = null) {
      messageBox.classList.add('show');
      messageText.textContent = text;
      if (list && list.length > 0) {
        messageList.textContent = list.join('، ');
        messageList.style.display = 'inline-block';
      } else {
        messageList.style.display = 'none';
      }
    }
    function hideMessage() {
      messageBox.classList.remove('show');
    }

    // ---------- Navigation ----------
    function goToPrev() {
      if (reviewMode) {
        const idx = pendingQueue.indexOf(currentIndex);
        if (idx > 0) {
          currentIndex = pendingQueue[idx - 1];
          renderQuestion();
        }
        return;
      }
      if (currentIndex > 0) {
        currentIndex--;
        renderQuestion();
      }
    }

    function goToNext() {
      // 1. Check child data completeness
      if (!isChildDataComplete()) {
        showMessage('⚠️ يرجى إكمال جميع بيانات الطفل (الاسم، النوع، تاريخ الميلاد، المدرسة، الصف) قبل المتابعة.');
        return;
      }

      const q = questions[currentIndex];
      const currentVal = responses[q.id];

      // 2. Check if current question has an answer
      if (currentVal === undefined) {
        showMessage('⚠️ يرجى اختيار إجابة أو تأجيل للسؤال الحالي.');
        return;
      }

      hideMessage();

      // 3. Handle review mode
      if (reviewMode) {
        // Move to next pending in queue
        const idx = pendingQueue.indexOf(currentIndex);
        if (idx !== -1 && idx < pendingQueue.length - 1) {
          currentIndex = pendingQueue[idx + 1];
          renderQuestion();
        } else {
          // All pending answered, show results
          showResults();
        }
        return;
      }

      // 4. Normal mode
      if (currentIndex === totalQuestions - 1) {
        // Last question -> check for pending
        const pending = getPendingIndices();
        if (pending.length === 0) {
          // All answered, show results
          showResults();
        } else {
          // Enter review mode
          reviewMode = true;
          pendingQueue = pending;
          currentIndex = pendingQueue[0];
          renderQuestion();
          showMessage(`⏳ هناك ${pending.length} سؤال(أسئلة) مؤجلة. يرجى الإجابة عليها الآن:`, pending.map(i => i+1));
        }
      } else {
        // Move to next question
        currentIndex++;
        renderQuestion();
      }
    }

    // ---------- Results ----------
    function showResults() {
      questionArea.style.display = 'none';
      resultsArea.classList.add('active');
      reviewMode = false;
      pendingQueue = [];
      reviewBadge.classList.add('hidden');
      hideMessage();
      renderResults();
    }

    function renderResults() {
      const sections = ['شخصي', 'أسري', 'اجتماعي', 'مدرسي', 'جسمي'];
      const sectionMap = {};
      sections.forEach(s => { sectionMap[s] = { sum: 0, count: 0 }; });

      questions.forEach(q => {
        const val = responses[q.id];
        if (val !== undefined && val !== null && typeof val === 'number') {
          const sec = q.section;
          if (sectionMap[sec]) {
            sectionMap[sec].sum += val;
            sectionMap[sec].count++;
          }
        }
      });

      let html = '';
      let grandTotal = 0, grandCount = 0;
      sections.forEach(sec => {
        const data = sectionMap[sec];
        const avg = data.count > 0 ? (data.sum / data.count) : 0;
        const avgRounded = avg.toFixed(2);
        grandTotal += data.sum;
        grandCount += data.count;
        const barPercent = (avg / 6) * 100;
        let barColor = '#22c55e';
        if (avg < 2.5) barColor = '#ef4444';
        else if (avg < 4) barColor = '#f59e0b';
        html += `
          <div class="result-card">
            <div>
              <div class="section-name">${sec}</div>
              <div style="font-size:13px;color:#64748b;">عدد الإجابات: ${data.count}</div>
            </div>
            <div class="avg-score" style="background:${barColor}20; color:${barColor};">${avgRounded}</div>
            <div class="result-bar"><div class="bar-fill" style="width:${barPercent}%; background:${barColor};"></div></div>
          </div>
        `;
      });
      resultsContainer.innerHTML = html;
      const overallAvg = grandCount > 0 ? (grandTotal / grandCount) : 0;
      totalScoreEl.textContent = `المعدل العام: ${overallAvg.toFixed(2)} من 6 (كلما قل الرقم، زادت المشكلة)`;
    }

    function hideResults() {
      resultsArea.classList.remove('active');
      questionArea.style.display = 'block';
      reviewMode = false;
      pendingQueue = [];
      reviewBadge.classList.add('hidden');
      // Return to first unanswered or last viewed?
      currentIndex = 0;
      renderQuestion();
    }

    // ---------- Export Excel ----------
    function exportToExcel() {
      const name = childName.value || 'غير محدد';
      const gender = childGender.value || 'غير محدد';
      const birth = childBirth.value || 'غير محدد';
      const age = childAge.textContent || 'غير محدد';
      const school = childSchool.value || 'غير محدد';
      const grade = childGrade.value || 'غير محدد';

      const rows = [];
      rows.push(['بيانات الطفل']);
      rows.push(['الاسم', name]);
      rows.push(['النوع', gender]);
      rows.push(['تاريخ الميلاد', birth]);
      rows.push(['العمر الزمني', age]);
      rows.push(['المدرسة', school]);
      rows.push(['الصف', grade]);
      rows.push([]);
      rows.push(['رقم السؤال', 'القسم', 'نص السؤال', 'التقييم']);
      questions.forEach((q, idx) => {
        const val = responses[q.id];
        let displayVal = 'غير مجاب';
        if (val === null) displayVal = '⏳ تأجيل';
        else if (typeof val === 'number') displayVal = val.toString();
        rows.push([idx+1, q.section, q.text, displayVal]);
      });

      const wb = XLSX.utils.book_new();
      const ws = XLSX.utils.aoa_to_sheet(rows);
      XLSX.utils.book_append_sheet(wb, ws, 'تقييم الطفل');
      ws['!cols'] = [{ wch: 15 }, { wch: 15 }, { wch: 50 }, { wch: 20 }];
      XLSX.writeFile(wb, `تقييم_الطفل_${new Date().toISOString().slice(0,10)}.xlsx`);
    }

    // ---------- Reset ----------
    function resetAll() {
      if (confirm('هل أنت متأكد من مسح جميع الإجابات وبيانات الطفل؟')) {
        resetResponses();
        childData = { name: '', gender: '', birth: '', school: '', grade: '' };
        childName.value = '';
        childGender.value = '';
        childBirth.value = '';
        childSchool.value = '';
        childGrade.value = '';
        updateAgeDisplay();
        saveToStorage();
        currentIndex = 0;
        reviewMode = false;
        pendingQueue = [];
        reviewBadge.classList.add('hidden');
        if (resultsArea.classList.contains('active')) hideResults();
        else renderQuestion();
        updateProgress();
        hideMessage();
      }
    }

    // ---------- Init ----------
    function init() {
      loadFromStorage();
      childBirth.addEventListener('change', () => { updateAgeDisplay(); saveToStorage(); });
      [childName, childGender, childSchool, childGrade].forEach(el => {
        el.addEventListener('change', saveToStorage);
        el.addEventListener('input', saveToStorage);
      });

      questions.forEach(q => { if (!(q.id in responses)) responses[q.id] = undefined; });
      saveToStorage();

      currentIndex = 0;
      renderQuestion();

      prevBtn.addEventListener('click', goToPrev);
      nextBtn.addEventListener('click', goToNext);
      resetBtn.addEventListener('click', resetAll);
      backToQuestionsBtn.addEventListener('click', hideResults);
      resetResultsBtn.addEventListener('click', resetAll);
      exportExcelBtn.addEventListener('click', exportToExcel);
    }

    init();
  })();
</script>
</body>
</html>
